name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types map to changelog groups in tasks/mix/tasks/changelog/add.ex
          types: |
            feat
            fix
            perf
            refactor
            docs
            build
            ci
            test
            chore
            style
            revert

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.19"]
        otp: ["27"]

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: loose

      - name: Install deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  lint:
    name: Lint (format + credo)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      # v3: rebuilt with :mix in the PLT (plt_add_apps) for the tasks/ modules
      PLT_CACHE_VERSION: v3

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      - name: Compute toolchain versions (for PLT cache key)
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "elixir=$(elixir -e 'IO.puts(System.version())')" >> "$GITHUB_OUTPUT"
          echo "erts=$(erl -noshell -eval 'io:format(\"~s\", [erlang:system_info(version)]), init:stop().' )" >> "$GITHUB_OUTPUT"

      - name: Restore PLT cache
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-dialyzer-${{ env.PLT_CACHE_VERSION }}-elixir-${{ steps.toolchain.outputs.elixir }}-erts-${{ steps.toolchain.outputs.erts }}-${{ hashFiles('**/mix.lock') }}

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Validate cached PLT (rebuild if old)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f priv/plts/project.plt ]; then
            if ! dialyzer --check_plt --plt priv/plts/project.plt; then
              echo "Cached PLT is incompatible/old; deleting and rebuilding..."
              # Remove the whole directory: the project.plt.hash sidecar must go too,
              # otherwise mix dialyzer --plt sees a matching hash and skips rebuilding
              # the deleted project.plt.
              rm -rf priv/plts
            fi
          fi

          mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer


