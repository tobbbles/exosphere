name: Release

# Reusable publish job, invoked by "Cut release" in the same workflow run —
# a GITHUB_TOKEN-created release would not trigger an `on: release` workflow,
# hence the in-run call. Manually dispatchable (defaults to main) for
# republishing; an `on: release` trigger is deliberately absent because a
# manually-created GitHub release has no precompiled NIF assets or checksum
# file yet, so auto-publishing from it would ship a broken package — run
# "Cut release" or the "Precompiled NIFs" workflow first.
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to publish (the release commit on main)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: The git ref to publish (defaults to the default branch)
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  hex_publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Via workflow_call: the checksum commit passed by "Cut release".
          # Via dispatch: the given ref (default main).
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      # No Rust toolchain needed: this ref has NIF release assets and the
      # committed checksum file, so compiling downloads the precompiled NIF.

      - name: Install deps
        run: mix deps.get

      # Build docs before publishing: a docs failure should abort the run
      # while nothing irreversible has happened yet.
      - name: Build docs (ExDoc)
        run: mix docs

      - name: Publish package
        run: mix hex.publish --yes

      - name: Publish docs
        run: mix hex.publish docs --yes


