name: Release

# Reusable publish job, invoked by "Cut release" in the same workflow run —
# a GITHUB_TOKEN-created release would not trigger an `on: release` workflow.
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to publish (the release commit on main)
        required: true
        type: string

permissions:
  contents: read

jobs:
  hex_publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      - name: Install deps
        run: mix deps.get

      # Build docs before publishing: a docs failure should abort the run
      # while nothing irreversible has happened yet.
      - name: Build docs (ExDoc)
        run: mix docs

      - name: Publish package
        run: mix hex.publish --yes

      - name: Publish docs
        run: mix hex.publish docs --yes


