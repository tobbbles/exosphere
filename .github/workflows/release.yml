name: Release

# Reusable publish job, invoked by "Cut release" in the same workflow run —
# a GITHUB_TOKEN-created release would not trigger an `on: release` workflow,
# hence the in-run call. Releases created by a user (e.g. a manual cut) do
# fire the trigger below.
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to publish (the release commit on main)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hex_publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Via workflow_call: the release commit passed by "Cut release".
          # Via on: release: github.ref is the tag, which is that same commit.
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      # The BLAKE3 NIF compiles from source, so any job that compiles the
      # project needs a Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: mix deps.get

      # Build docs before publishing: a docs failure should abort the run
      # while nothing irreversible has happened yet.
      - name: Build docs (ExDoc)
        run: mix docs

      - name: Publish package
        run: mix hex.publish --yes

      - name: Publish docs
        run: mix hex.publish docs --yes


