name: Release

# Triggered by the GitHub Release that "Cut release" creates; the tag always
# points at the release commit on main.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hex_publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose
          hex-cache: true
          rebar-cache: true
          mix-cache: true

      - name: Install deps
        run: mix deps.get

      # Build docs before publishing: a docs failure should abort the run
      # while nothing irreversible has happened yet.
      - name: Build docs (ExDoc)
        run: mix docs

      - name: Publish package
        run: mix hex.publish --yes

      - name: Publish docs
        run: mix hex.publish docs --yes


