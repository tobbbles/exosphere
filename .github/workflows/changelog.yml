name: Changelog

on:
  pull_request:
    types: [closed]

concurrency:
  # Shared with "Cut release": changelog appends and release cuts must never
  # race each other on CHANGELOG.md.
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add-entry:
    name: Add merged PR to [Unreleased]
    if: >-
      ${{
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main'
      }}
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      - name: Install deps
        run: mix deps.get

      - name: Add changelog entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: mix changelog.add --title "$PR_TITLE" --pr "$PR_NUMBER"

      - name: Configure deploy key
        env:
          EXOSPHERE_DEPLOY_KEY: ${{ secrets.EXOSPHERE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Secrets pasted as a single line keep literal \n (and sometimes
          # \r\n) sequences; convert them back and strip CR / stray quotes so
          # libcrypto can parse the key (OpenSSH or PKCS#8/PEM).
          printf '%s' "$EXOSPHERE_DEPLOY_KEY" \
            | sed -e 's/^"//' -e 's/"$//' -e 's/\\r//g' -e 's/\\n/\n/g' \
            | tr -d '\r' > ~/.ssh/id_ed25519
          # Key parsers reject files without a final newline.
          if [ -n "$(tail -c 1 ~/.ssh/id_ed25519)" ]; then
            echo >> ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>~/key_err.txt </dev/null; then
            echo "::error::EXOSPHERE_DEPLOY_KEY is not a parsable private key."
            echo "Diagnostics (no secret material): $(wc -c < ~/.ssh/id_ed25519) bytes, $(wc -l < ~/.ssh/id_ed25519) lines, header: $(head -1 ~/.ssh/id_ed25519)"
            head -1 ~/key_err.txt
            if head -1 ~/.ssh/id_ed25519 | grep -qE '^(ssh-|ecdsa-|sk-)'; then
              echo "Hint: this looks like a PUBLIC key — the secret must hold the private half of the deploy key pair."
            elif grep -qi 'passphrase' ~/key_err.txt; then
              echo "Hint: the key appears to be passphrase-protected — deploy keys must be generated without a passphrase."
            fi
            exit 1
          fi
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Pushes authenticate as the deploy key (ruleset bypass); reads and
          # other git operations keep using the GITHUB_TOKEN https remote.
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Commit and push (retry on race)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog change for #$PR_NUMBER; nothing to push."
            exit 0
          fi
          git commit -m "chore(changelog): add #$PR_NUMBER [skip ci]"
          pushed=0
          for _ in 1 2 3; do
            if git push origin main; then pushed=1; break; fi
            echo "Push rejected; rebasing on latest main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          if [ "$pushed" -ne 1 ]; then
            echo "Could not push changelog entry for #$PR_NUMBER after 3 attempts." >&2
            exit 1
          fi
