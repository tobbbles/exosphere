name: Changelog

on:
  pull_request:
    types: [closed]

concurrency:
  # Shared with "Cut release": changelog appends and release cuts must never
  # race each other on CHANGELOG.md.
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add-entry:
    name: Add merged PR to [Unreleased]
    if: >-
      ${{
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main'
      }}
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      - name: Install deps
        run: mix deps.get

      - name: Add changelog entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: mix changelog.add --title "$PR_TITLE" --pr "$PR_NUMBER"

      - name: Configure deploy key
        env:
          EXOSPHERE_DEPLOY_KEY: ${{ secrets.EXOSPHERE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EXOSPHERE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Pushes authenticate as the deploy key (ruleset bypass); reads and
          # other git operations keep using the GITHUB_TOKEN https remote.
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Commit and push (retry on race)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog change for #$PR_NUMBER; nothing to push."
            exit 0
          fi
          git commit -m "chore(changelog): add #$PR_NUMBER [skip ci]"
          pushed=0
          for _ in 1 2 3; do
            if git push origin main; then pushed=1; break; fi
            echo "Push rejected; rebasing on latest main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          if [ "$pushed" -ne 1 ]; then
            echo "Could not push changelog entry for #$PR_NUMBER after 3 attempts." >&2
            exit 1
          fi
