name: Cut release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level (auto-detected from the changelog when 'auto')"
        type: choice
        options: ["auto", "major", "minor", "patch"]
        default: "auto"

concurrency:
  # Shared with "Changelog": changelog appends and release cuts must never
  # race each other on CHANGELOG.md.
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut:
    name: Cut release from main
    runs-on: ubuntu-latest

    outputs:
      # Job outputs are plain expressions (no description/value mapping —
      # that syntax is step-outputs only and makes the workflow unparseable).
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.version.outputs.version }}

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"
          version-type: loose

      # The BLAKE3 NIF compiles from source, so any job that compiles the
      # project needs a Rust toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: mix deps.get

      - name: Promote [Unreleased] and bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          args=()
          if [ "$BUMP" != "auto" ]; then
            args+=(--bump "$BUMP")
          fi
          mix changelog.cut "${args[@]}" --notes-path release_notes.md

      - name: Read new version
        id: version
        run: |
          set -euo pipefail
          version="$(grep -m1 -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure deploy key
        env:
          EXOSPHERE_DEPLOY_KEY: ${{ secrets.EXOSPHERE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Secrets pasted as a single line keep literal \n (and sometimes
          # \r\n) sequences; convert them back and strip CR / stray quotes so
          # libcrypto can parse the key (OpenSSH or PKCS#8/PEM).
          printf '%s' "$EXOSPHERE_DEPLOY_KEY" \
            | sed -e 's/^"//' -e 's/"$//' -e 's/\\r//g' -e 's/\\n/\n/g' \
            | tr -d '\r' > ~/.ssh/id_ed25519
          # Key parsers reject files without a final newline.
          if [ -n "$(tail -c 1 ~/.ssh/id_ed25519)" ]; then
            echo >> ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>~/key_err.txt </dev/null; then
            echo "::error::EXOSPHERE_DEPLOY_KEY is not a parsable private key."
            echo "Diagnostics (no secret material): $(wc -c < ~/.ssh/id_ed25519) bytes, $(wc -l < ~/.ssh/id_ed25519) lines, header: $(head -1 ~/.ssh/id_ed25519)"
            head -1 ~/key_err.txt
            if head -1 ~/.ssh/id_ed25519 | grep -qE '^(ssh-|ecdsa-|sk-)'; then
              echo "Hint: this looks like a PUBLIC key — the secret must hold the private half of the deploy key pair."
            elif grep -qi 'passphrase' ~/key_err.txt; then
              echo "Hint: the key appears to be passphrase-protected — deploy keys must be generated without a passphrase."
            fi
            exit 1
          fi
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Pushes authenticate as the deploy key (ruleset bypass); reads and
          # other git operations keep using the GITHUB_TOKEN https remote.
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Commit and push (retry on race)
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md mix.exs README.md
          git commit -m "chore: release v${version} [skip ci]"
          pushed=0
          for _ in 1 2 3; do
            if git push origin main; then pushed=1; break; fi
            echo "Push rejected; rebasing on latest main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          if [ "$pushed" -ne 1 ]; then
            echo "Could not push release v${version} after 3 attempts." >&2
            exit 1
          fi

      - name: Create GitHub Release (tags the pushed commit)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Tag via the release so it always points at the commit just pushed
          # to main, never at a workflow-local orphan.
          gh release create "v${version}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${version}" \
            --notes-file release_notes.md
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Builds the precompiled BLAKE3 NIF tarballs for every target, attaches
  # them to the release, and commits the checksum file to main. Publish
  # depends on it: the Hex package ships that checksum file, and users
  # compiling the fresh version need the release assets live.
  nifs:
    name: Precompiled NIFs
    needs: cut
    uses: ./.github/workflows/nifs.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.cut.outputs.sha }}
      version: ${{ needs.cut.outputs.version }}

  # Runs in this same workflow because a GITHUB_TOKEN-created release does
  # not trigger `on: release` workflows. Publishes the checksum commit (not
  # this run's dispatch-time HEAD, and not the bare release commit — the
  # package must include the checksum file).
  publish:
    name: Publish to Hex.pm
    needs: [cut, nifs]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      ref: ${{ needs.nifs.outputs.sha }}
